<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffe8f1"><title>Sakura Flap 🌸</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,'Segoe UI',sans-serif;background:#fff0f5;touch-action:none}body{display:grid;place-items:center}#wrap{position:relative;height:min(100dvh,820px);width:min(100vw,470px);overflow:hidden;background:#ffeff5;box-shadow:0 0 45px #db9fbc66}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none;color:#954b75;font-weight:800;text-shadow:0 1px white;font-size:17px}.score{font-size:30px}.panel{position:absolute;inset:0;display:grid;place-items:center;background:#fff4f8a6;backdrop-filter:blur(4px);padding:22px}.panel.hidden{display:none}.card{width:min(100%,345px);background:#ffffffed;border:2px solid #ffd0e2;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 18px 45px #c66e9b35;color:#83466a}.flower{font-size:53px}.card h1{font-size:32px;margin:8px 0;color:#b45287}.card p{line-height:1.55;font-size:15px}.btn{appearance:none;border:0;background:linear-gradient(135deg,#f6a5c8,#df75a6);color:#fff;padding:15px 26px;border-radius:999px;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 6px 0 #bf6b94;touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #bf6b94}.tiny{font-size:12px;opacity:.75;margin-top:16px}.mute{position:absolute;right:15px;bottom:16px;border:1px solid #e7a4c1;background:#fff9;border-radius:50%;width:42px;height:42px;font-size:20px;cursor:pointer}.footer{position:absolute;bottom:15px;left:16px;color:#9d6685;font-size:12px;pointer-events:none}</style></head><body><div id="wrap"><canvas id="game" aria-label="Sakura Flap oyunu"></canvas><div class="hud"><div>🌸 <span id="score" class="score">0</span></div><div>🏆 <span id="best">0</span></div></div><div id="panel" class="panel"><div class="card"><div class="flower" id="flower">🌸🐤🌸</div><h1 id="heading">Sakura Flap</h1><p id="message">Minik kuşu sakura bahçesindeki engellerin arasından geçir!<br><b>Boşluk</b>, <b>↑</b> veya ekrana dokunarak uç.</p><button class="btn" id="start">Oynamaya Başla ✨</button><div class="tiny">Telefon ve bilgisayarda oynanır • İnternetsiz çalışır</div></div></div><button class="mute" id="mute" aria-label="Sesi aç kapa">🔊</button><div class="footer">♡ Sakura Bahçesi ♡</div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap'),panel=document.getElementById('panel'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),heading=document.getElementById('heading'),message=document.getElementById('message'),flower=document.getElementById('flower'),start=document.getElementById('start'),mute=document.getElementById('mute');let W=390,H=700,scale=1,mode='ready',bird={x:100,y:300,vy:0,r:17},pipes=[],petals=[],score=0,best=0,last=0,spawn=0,ground=70,audio=null,sound=true,elapsed=0;try{best=Number(localStorage.getItem('sakura-flap-best')||0)||0}catch(e){}bestEl.textContent=best;function resize(){const r=wrap.getBoundingClientRect();W=r.width;H=r.height;scale=Math.min(W/390,H/700);ground=Math.max(58,70*scale);canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);bird.x=W*.27;if(mode!=='playing')bird.y=H*.42}window.addEventListener('resize',resize);resize();function beep(freq=500,duration=.08,type='sine'){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.65),audio.currentTime+duration);g.gain.setValueAtTime(.075,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}function begin(){mode='playing';score=0;scoreEl.textContent=0;bird.y=H*.42;bird.vy=-4*scale;pipes=[];petals=[];spawn=0;elapsed=0;panel.classList.add('hidden');beep(650)}function flap(){if(mode==='ready'||mode==='over'){begin();return}bird.vy=-5.8*scale;beep(550,.055)}function over(){if(mode!=='playing')return;mode='over';beep(190,.28,'triangle');if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('sakura-flap-best',String(best))}catch(e){}}flower.textContent=score>=10?'🌸🏆🌸':'🌸🐤💗';heading.textContent='Oyun Bitti!';message.innerHTML='Puanın: <b>'+score+'</b> &nbsp;•&nbsp; Rekorun: <b>'+best+'</b><br>Bir kez daha denemeye ne dersin?';start.textContent='Tekrar Oyna 🌷';panel.classList.remove('hidden')}start.addEventListener('click',e=>{e.stopPropagation();begin()});canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap()});document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)flap()}});mute.addEventListener('click',()=>{sound=!sound;mute.textContent=sound?'🔊':'🔇'});function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function cloud(x,y,s){ctx.fillStyle='#fff9';for(const [dx,dy,r] of [[0,0,22],[22,-12,29],[48,0,23]]){ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,r*s,0,Math.PI*2);ctx.fill()}}function blossom(x,y,s=1,a=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=a;for(let k=0;k<5;k++){ctx.save();ctx.rotate(k*Math.PI*2/5);ctx.fillStyle='#f9aacb';ctx.beginPath();ctx.ellipse(0,-7,5,8,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.fillStyle='#fff1a3';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();ctx.restore()}function background(t){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#fff0f6');grad.addColorStop(.68,'#f9dce9');grad.addColorStop(1,'#f8d7e6');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff6c9';ctx.beginPath();ctx.arc(W*.8,H*.19,42*scale,0,Math.PI*2);ctx.fill();for(let i=0;i<4;i++)cloud(((i*150+25-t*9)%(W+180)+W+180)%(W+180)-70,H*(.14+i*.12),.55*scale);ctx.fillStyle='#e9bdd0';for(let i=0;i<8;i++){let x=i*W/7;ctx.beginPath();ctx.arc(x,H-ground+20,45*scale,Math.PI,0);ctx.fill()}ctx.fillStyle='#d4a6bb';ctx.fillRect(0,H-ground,W,ground);ctx.fillStyle='#fff3f8';ctx.fillRect(0,H-ground,W,9*scale);for(let i=0;i<16;i++){const x=i*W/15;blossom(x,H-ground+24+(i%3)*12, .42*scale,.7)}}function pipe(p){const cap=17*scale,rad=13*scale;ctx.fillStyle='#e9a4bf';rr(p.x,0,p.w,p.top,rad);ctx.fill();ctx.fillStyle='#f7c7da';rr(p.x+5*scale,0,8*scale,p.top,5*scale);ctx.fill();ctx.fillStyle='#d986ac';rr(p.x-4*scale,p.top-cap,p.w+8*scale,cap+5*scale,6*scale);ctx.fill();const bot=p.top+p.gap;ctx.fillStyle='#e9a4bf';rr(p.x,bot,p.w,H-ground-bot,rad);ctx.fill();ctx.fillStyle='#f7c7da';rr(p.x+5*scale,bot,8*scale,H-ground-bot,5*scale);ctx.fill();ctx.fillStyle='#d986ac';rr(p.x-4*scale,bot-2*scale,p.w+8*scale,cap+5*scale,6*scale);ctx.fill();for(let y=65*scale;y<p.top-25*scale;y+=75*scale)blossom(p.x+p.w*.68,y,.8*scale,.9);for(let y=bot+45*scale;y<H-ground-15*scale;y+=75*scale)blossom(p.x+p.w*.65,y,.8*scale,.9)}function drawBird(t){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.35,Math.min(.95,bird.vy/12)));ctx.fillStyle='#ffe9a6';ctx.beginPath();ctx.ellipse(0,0,bird.r*1.12,bird.r,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd27d';ctx.beginPath();ctx.ellipse(-8*scale,5*scale,9*scale,6*scale,Math.sin(t*18)*.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9a5577';ctx.beginPath();ctx.arc(7*scale,-5*scale,2.6*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f18da9';ctx.beginPath();ctx.arc(9*scale,4*scale,4*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f0a85f';ctx.beginPath();ctx.moveTo(15*scale,0);ctx.lineTo(25*scale,4*scale);ctx.lineTo(15*scale,8*scale);ctx.fill();ctx.restore()}function update(dt){elapsed+=dt;const speed=(2.4+Math.min(score,25)*.065)*scale*dt*60;if(mode==='playing'){bird.vy+=.27*scale*dt*60;bird.y+=bird.vy*dt*60;spawn+=dt;if(spawn>1.62){spawn=0;const gap=Math.max(145,192-Math.min(score,20)*1.5)*scale;const minTop=85*scale,maxTop=H-ground-gap-100*scale;const top=minTop+Math.random()*Math.max(1,maxTop-minTop);pipes.push({x:W+20,w:65*scale,top,gap,passed:false})}for(const p of pipes){p.x-=speed;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;scoreEl.textContent=score;beep(850,.09)}const r=bird.r*.78;if(bird.x+r>p.x&&bird.x-r<p.x+p.w&&(bird.y-r<p.top||bird.y+r>p.top+p.gap))over()}pipes=pipes.filter(p=>p.x+p.w>-20);if(bird.y+bird.r>H-ground||bird.y-bird.r<0)over()}else if(mode==='ready'){bird.y=H*.42+Math.sin(elapsed*3)*9*scale}if(Math.random()<dt*7)petals.push({x:Math.random()*W,y:-15,s:Math.random()*.55+.3,v:30+Math.random()*45,phase:Math.random()*6});for(const p of petals){p.y+=p.v*dt;p.x+=Math.sin(elapsed*2+p.phase)*15*dt}petals=petals.filter(p=>p.y<H+20)}function draw(t){ctx.clearRect(0,0,W,H);background(t);for(const p of pipes)pipe(p);for(const p of petals)blossom(p.x,p.y,p.s*scale,.55);drawBird(t)}function frame(now){if(!last)last=now;const dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw(now/1000);requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
