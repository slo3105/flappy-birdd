<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffe8f1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sakura Flap"><link rel="manifest" href="/flappy-bird/manifest.webmanifest"><link rel="apple-touch-icon" href="/flappy-bird/icon-192.png"><title>Sakura Flap 🌸</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,'Segoe UI',sans-serif;background:#fff0f5;touch-action:none}body{display:grid;place-items:center}#wrap{position:relative;height:min(100dvh,820px);width:min(100vw,470px);overflow:hidden;background:#ffeff5;box-shadow:0 0 45px #db9fbc66}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none;color:#954b75;font-weight:800;text-shadow:0 1px white;font-size:17px}.score{font-size:30px}.panel{position:absolute;inset:0;display:grid;place-items:center;background:#fff4f8a6;backdrop-filter:blur(4px);padding:22px}.panel.hidden{display:none}.card{width:min(100%,345px);background:#ffffffed;border:2px solid #ffd0e2;border-radius:28px;padding:28px 22px;text-align:center;box-shadow:0 18px 45px #c66e9b35;color:#83466a}.flower{font-size:53px}.card h1{font-size:32px;margin:8px 0;color:#b45287}.card p{line-height:1.55;font-size:15px}.btn{appearance:none;border:0;background:linear-gradient(135deg,#f6a5c8,#df75a6);color:#fff;padding:15px 26px;border-radius:999px;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 6px 0 #bf6b94;touch-action:manipulation}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #bf6b94}.tiny{font-size:12px;opacity:.75;margin-top:16px}.mute{position:absolute;right:15px;bottom:16px;borde (()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap'),panel=document.getElementById('panel'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),heading=document.getElementById('heading'),message=document.getElementById('message'),flower=document.getElementById('flower'),start=document.getElementById('start'),mute=document.getElementById('mute'),language=document.getElementById('language'),tiny=document.getElementById('tiny'),footer=document.getElementById('footer');let W=390,H=700,scale=1,mode='ready',bird={x:100,y:300,vy:0,r:17},pipes=[],petals=[],score=0,best=0,last=0,spawn=0,ground=70,audio=null,sound=true,elapsed=0,musicNext=0,musicStep=0;try{best=Number(localStorage.getItem('sakura-flap-best')||0)||0}catch(e){}bestEl.textContent=best;const translations={tr:{intro:'Minik kuşu sakura bahçesindeki engellerin arasından geçir!<br><b>Boşluk</b>, <b>↑</b> veya ekrana dokunarak uç.',play:'Oynamaya Başla ✨',over:'Oyun Bitti!',again:'Tekrar Oyna 🌷',result:(score,best)=>'Puanın: <b>'+score+'</b> &nbsp;•&nbsp; Rekorun: <b>'+best+'</b><br>Bir kez daha denemeye ne dersin?',tiny:'Telefon ve bilgisayarda oynanır • İnternetsiz çalışır',footer:'♡ Sakura Bahçesi ♡',mute:'Sesi aç veya kapat',canvas:'Sakura Flap oyunu'},en:{intro:'Guide the little bird through the sakura garden!<br>Press <b>Space</b>, <b>↑</b>, or tap to fly.',play:'Start Playing ✨',over:'Game Over!',again:'Play Again 🌷',result:(score,best)=>'Score: <b>'+score+'</b> &nbsp;•&nbsp; Best: <b>'+best+'</b><br>Want to give it another try?',tiny:'Play on phone or computer • Works offline',footer:'♡ Sakura Garden ♡',mute:'Toggle sound',canvas:'Sakura Flap game'}};let lang='tr';try{lang=localStorage.getItem('sakura-flap-lang')==='en'?'en':'tr'}catch(e){}language.value=lang;function applyLanguage(){const t=translations[lang];document.documentElement.lang=lang;tiny.textContent=t.tiny;footer.textContent=t.footer;mute.setAttribute('aria-label',t.mute);canvas.setAttribute('aria-label',t.canvas);if(mode==='over'){heading.textContent=t.over;message.innerHTML=t.result(score,best);start.textContent=t.again}else{heading.textContent='Sakura Flap';message.innerHTML=t.intro;start.textContent=t.play}}language.addEventListener('change',()=>{lang=language.value;try{localStorage.setItem('sakura-flap-lang',lang)}catch(e){}applyLanguage()});applyLanguage();function resize(){const r=wrap.getBoundingClientRect();W=r.width;H=r.height;scale=Math.min(W/390,H/700);ground=Math.max(58,70*scale);canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);bird.x=W*.27;if(mode!=='playing')bird.y=H*.42}window.addEventListener('resize',resize);resize();function beep(freq=500,duration=.08,type='sine',volume=.016){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const now=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,now);o.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.86),now+duration);g.gain.setValueAtTime(.0001,now);g.gain.linearRampToValueAtTime(volume,now+.018);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+duration+.01)}catch(e){}}function startMusic(){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();if(!musicNext||musicNext<audio.currentTime)musicNext=audio.currentTime+.15}catch(e){}}function musicTick(){if(mode!=='playing'||!audio||audio.state!=='running'||!sound)return;const melody=[392,440,523.25,440,349.23,392,440,392,329.63,349.23,392,349.23,293.66,329.63,349.23,329.63];if(!musicNext||musicNext<audio.currentTime)musicNext=audio.currentTime+.15;let guard=0;while(musicNext<audio.currentTime+.15&&guard++<2){const note=melody[musicStep++%melody.length],o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(note,musicNext);g.gain.setValueAtTime(.0001,musicNext);g.gain.linearRampToValueAtTime(.0025,musicNext+.10);g.gain.exponentialRampToValueAtTime(.0001,musicNext+.58);o.connect(g);g.connect(audio.destination);o.start(musicNext);o.stop(musicNext+.60);musicNext+=.66}}function begin(){startMusic();mode='playing';musicNext=0;musicStep=0;score=0;scoreEl.textContent=0;bird.y=H*.42;bird.vy=-4*scale;pipes=[];petals=[];spawn=0;elapsed=0;panel.classList.add('hidden');beep(470,.07,'sine',.012)}function flap(){startMusic();if(mode==='ready'||mode==='over'){begin();return}bird.vy=-5.8*scale;beep(420,.06,'sine',.008)}function over(){if(mode!=='playing')return;mode='over';beep(240,.20,'sine',.014);if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('sakura-flap-best',String(best))}catch(e){}}flower.textContent=score>=10?'🌸🏆🌸':'🌸🐤💗';heading.textContent=translations[lang].over;message.innerHTML=translations[lang].result(score,best);start.textContent=translations[lang].again;panel.classList.remove('hidden')}start.addEventListener('click',e=>{e.stopPropagation();begin()});canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap()});document.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)flap()}});mute.addEventListener('click',()=>{sound=!sound;mute.textContent=sound?'🔊':'🔇';if(sound&&mode==='playing')startMusic()});function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function cloud(x,y,s){ctx.fillStyle='#fff9';for(const [dx,dy,r] of [[0,0,22],[22,-12,29],[48,0,23]]){ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,r*s,0,Math.PI*2);ctx.fill()}}function blossom(x,y,s=1,a=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=a;for(let k=0;k<5;k++){ctx.save();ctx.rotate(k*Math.PI*2/5);ctx.fillStyle='#f9aacb';ctx.beginPath();ctx.ellipse(0,-7,5,8,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.fillStyle='#fff1a3';ctx.beginPath();ctx.arc(0,0,3,0,Math.PI*2);ctx.fill();ctx.restore()}function background(t){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#fff0f6');grad.addColorStop(.68,'#f9dce9');grad.addColorStop(1,'#f8d7e6');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff6c9';ctx.beginPath();ctx.arc(W*.8,H*.19,42*scale,0,Math.PI*2);ctx.fill();for(let i=0;i<4;i++)cloud(((i*150+25-t*9)%(W+180)+W+180)%(W+180)-70,H*(.14+i*.12),.55*scale);ctx.fillStyle='#e9bdd0';for(let i=0;i<8;i++){let x=i*W/7;ctx.beginPath();ctx.arc(x,H-ground+20,45*scale,Math.PI,0);ctx.fill()}ctx.fillStyle='#d4a6bb';ctx.fillRect(0,H-ground,W,ground);ctx.fillStyle='#fff3f8';ctx.fillRect(0,H-ground,W,9*scale);for(let i=0;i<16;i++){const x=i*W/15;blossom(x,H-ground+24+(i%3)*12, .42*scale,.7)}}function pipe(p){const cap=17*scale,rad=13*scale;ctx.fillStyle='#e9a4bf';rr(p.x,0,p.w,p.top,rad);ctx.fill();ctx.fillStyle='#f7c7da';rr(p.x+5*scale,0,8*scale,p.top,5*scale);ctx.fill();ctx.fillStyle='#d986ac';rr(p.x-4*scale,p.top-cap,p.w+8*scale,cap+5*scale,6*scale);ctx.fill();const bot=p.top+p.gap;ctx.fillStyle='#e9a4bf';rr(p.x,bot,p.w,H-ground-bot,rad);ctx.fill();ctx.fillStyle='#f7c7da';rr(p.x+5*scale,bot,8*scale,H-ground-bot,5*scale);ctx.fill();ctx.fillStyle='#d986ac';rr(p.x-4*scale,bot-2*scale,p.w+8*scale,cap+5*scale,6*scale);ctx.fill();for(let y=65*scale;y<p.top-25*scale;y+=75*scale)blossom(p.x+p.w*.68,y,.8*scale,.9);for(let y=bot+45*scale;y<H-ground-15*scale;y+=75*scale)blossom(p.x+p.w*.65,y,.8*scale,.9)}function drawBird(t){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-.35,Math.min(.95,bird.vy/12)));ctx.fillStyle='#ffe9a6';ctx.beginPath();ctx.ellipse(0,0,bird.r*1.12,bird.r,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd27d';ctx.beginPath();ctx.ellipse(-8*scale,5*scale,9*scale,6*scale,Math.sin(t*18)*.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9a5577';ctx.beginPath();ctx.arc(7*scale,-5*scale,2.6*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f18da9';ctx.beginPath();ctx.arc(9*scale,4*scale,4*scale,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f0a85f';ctx.beginPath();ctx.moveTo(15*scale,0);ctx.lineTo(25*scale,4*scale);ctx.lineTo(15*scale,8*scale);ctx.fill();ctx.restore()}function update(dt){elapsed+=dt;const difficulty=Math.min(1,(score/32)+(elapsed/190));const speed=(2.35+2.15*difficulty)*scale*dt*60;if(mode==='playing'){bird.vy+=.27*scale*dt*60;bird.y+=bird.vy*dt*60;spawn+=dt;if(spawn>1.68-.30*difficulty){spawn=0;const gap=(194-42*difficulty)*scale;const minTop=85*scale,maxTop=H-ground-gap-100*scale;const top=minTop+Math.random()*Math.max(1,maxTop-minTop);pipes.push({x:W+20,w:65*scale,top,gap,passed:false})}for(const p of pipes){p.x-=speed;if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;scoreEl.textContent=score;beep(660,.14,'sine',.012)}const r=bird.r*.78;if(bird.x+r>p.x&&bird.x-r<p.x+p.w&&(bird.y-r<p.top||bird.y+r>p.top+p.gap))over()}pipes=pipes.filter(p=>p.x+p.w>-20);if(bird.y+bird.r>H-ground||bird.y-bird.r<0)over()}else if(mode==='ready'){bird.y=H*.42+Math.sin(elapsed*3)*9*scale}if(Math.random()<dt*2.2&&petals.length<15)petals.push({x:Math.random()*W,y:-15,s:Math.random()*.55+.3,v:30+Math.random()*45,phase:Math.random()*6});for(const p of petals){p.y+=p.v*dt;p.x+=Math.sin(elapsed*2+p.phase)*15*dt}petals=petals.filter(p=>p.y<H+20)}function draw(t){ctx.clearRect(0,0,W,H);background(t);for(const p of pipes)pipe(p);for(const p of petals)blossom(p.x,p.y,p.s*scale,.55);drawBird(t)}function frame(now){musicTick();if(!last)last=now;const dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw(now/1000);requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script><script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { window.addEventListener("load", () => navigator.serviceWorker.register("/flappy-bird/sw.js", {scope:"/flappy-bird/"}).catch(() => {})); }</script></body></html>
